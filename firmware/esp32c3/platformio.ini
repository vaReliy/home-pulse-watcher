; PlatformIO Project Configuration
; HomePulse Watcher - ESP32-C3 Firmware

[env:esp32c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; Libraries
lib_deps =
    WiFi
    HTTPClient
    ArduinoJson@^7.0.0
    Adafruit NeoPixel@^1.12.0
    symlink://../../libs/firmware-shared

; Build flags
; HPW_USE_TLS=1: telemetry POST and OTA-check POST use WiFiClientSecure with
; the pinned GTS Root R1 CA (see libs/firmware-shared/include/HomePulse/transport_client.h).
; This is the release env used by scripts/firmware-docker-build.sh — see
; [env:esp32c3_dev] below for a plaintext-HTTP local-dev override.
; PORTAL_AP_PASSWORD: captive-portal AP password, supplied at build time via
; the PORTAL_AP_PASSWORD env var (set HPW_PORTAL_AP_PASSWORD in .env; see
; scripts/firmware-docker-build.sh, which reads .env and passes it through as
; a Docker build-arg). Never hardcoded in source — see portal.h for why a
; fixed (non-per-device) password is an accepted design choice here.
build_flags =
    -I src
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    -DHPW_USE_TLS=1
    -DPORTAL_AP_PASSWORD=\"${sysenv.PORTAL_AP_PASSWORD}\"

; Source: shared main.cpp — board-specific values supplied by config.h in src/
build_src_filter = -<*> +<../../common/main.cpp>

; Partition table (explicit OTA layout for 4MB flash)
board_build.partitions = partitions.csv

; Upload settings
upload_speed = 921600

; Monitor settings
monitor_filters = esp32_exception_decoder
monitor_dtr = 0
monitor_rts = 0

; Local-dev override: plaintext HTTP, for testing against a local (non-HTTPS)
; backend. Build/flash with: pio run -e esp32c3_dev -t upload
[env:esp32c3_dev]
extends = esp32c3
build_flags =
    ${env:esp32c3.build_flags}
    -UHPW_USE_TLS
    -DHPW_USE_TLS=0
