; PlatformIO Project Configuration
; HomePulse Watcher - ESP32-C3 Firmware

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; Libraries
lib_deps =
    WiFi
    HTTPClient
    ArduinoJson@^7.0.0

; Build flags
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3

; Upload settings
upload_speed = 921600

; Monitor settings
monitor_filters = esp32_exception_decoder
