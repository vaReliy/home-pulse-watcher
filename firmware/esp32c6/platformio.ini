; PlatformIO Project Configuration
; HomePulse Watcher - ESP32-C6 Firmware

[env:esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200

; Libraries
lib_deps =
    WiFi
    HTTPClient
    ArduinoJson@^7.0.0
    Adafruit NeoPixel@^1.12.0
    symlink://../../libs/firmware-shared

; Build flags
build_flags =
    -I src
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3

; Source: shared main.cpp — board-specific values supplied by config.h in src/
build_src_filter = -<*> +<../../common/main.cpp>

; Partition table (explicit OTA layout for 4MB flash)
board_build.partitions = partitions.csv

; Upload settings
upload_speed = 921600

; Monitor settings
monitor_filters = esp32_exception_decoder
monitor_dtr = 0
monitor_rts = 0
