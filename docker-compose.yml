services:
  postgres:
    image: postgres:15-alpine
    container_name: home-pulse-db
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-home_pulse_watcher}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
