; PlatformIO configuration for HomePulse shared library
; Used for native unit tests (Unity framework, no hardware required)

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -DUNIT_TEST
    -I include
    -I test/mocks
build_src_filter =
    +<debounce.cpp>
    +<telemetry.cpp>
    +<ota.cpp>
lib_deps =
    fabiobatsilva/ArduinoFake@^0.3.0
    bblanchon/ArduinoJson@^7.0.0
test_build_src = yes

; Second native env, identical to [env:native] except it flips HPW_USE_TLS to
; 1. transport_client.h guards every Arduino/network header (WiFiClientSecure,
; gts_root_ca.h, ...) behind `#ifndef UNIT_TEST`, so this only changes the
; compile-time value of HomePulse::kTransportUsesTls — no host stubbing of
; WiFiClientSecure needed. Exercises the =1 branch of
; test_kTransportUsesTls_matches_HPW_USE_TLS_macro, which [env:native] alone
; can never reach.
[env:native_tls]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -DHPW_USE_TLS=1
