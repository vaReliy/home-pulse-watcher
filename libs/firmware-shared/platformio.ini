; PlatformIO configuration for HomePulse shared library
; Used for native unit tests (Unity framework, no hardware required)

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -DUNIT_TEST
    -I include
    -I test/mocks
build_src_filter =
    +<debounce.cpp>
    +<telemetry.cpp>
    +<ota.cpp>
lib_deps =
    fabiobatsilva/ArduinoFake@^0.3.0
test_build_src = yes
